name: Publish Windows release

on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-windows.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v0.3.1
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows ZIP
        shell: pwsh
        run: ./Publish-Release.ps1
      - name: Publish GitHub release
        shell: pwsh
        run: |
          $asset = 'Specs Panel/bin/Packages/SpecsPanel-win-x64.zip'
          gh release create $env:RELEASE_TAG $asset --target $env:GITHUB_SHA --title "Specs Panel $env:RELEASE_TAG" --notes "Extract the ZIP and double-click Start SpecsPanel.cmd. Specs Panel downloads the PawnIO installer on startup when the driver is missing."
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
